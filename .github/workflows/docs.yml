name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "*.md"
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('**/requirements.txt', 'mkdocs.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-docs-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material>=9.0.0
          pip install mkdocs-git-revision-date-localized-plugin>=1.2.0
          pip install mkdocs-minify-plugin>=0.7.0
          pip install pymdown-extensions>=10.0.0
          pip install mike>=2.0.0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global init.defaultBranch main

      - name: Verify MkDocs configuration
        run: |
          echo "Verifying MkDocs configuration..."
          mkdocs --version
          mike --version

          echo "Checking mkdocs.yml..."
          if [ ! -f mkdocs.yml ]; then
            echo "Error: mkdocs.yml not found"
            exit 1
          fi

          echo "Testing MkDocs build..."
          mkdocs build --clean --strict --verbose

          echo "Cleaning up test build..."
          rm -rf site/

      - name: Deploy latest version (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          echo "Deploying latest version from main branch..."

          # Deploy latest version
          mike deploy --push --update-aliases latest main

          # Set as default
          mike set-default --push latest

          echo "Latest version deployed successfully"

      - name: Deploy release version
        if: github.event_name == 'release'
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}

          echo "Deploying documentation for release version: $VERSION"
          echo "Release tag: ${{ github.event.release.tag_name }}"
          echo "Release name: ${{ github.event.release.name }}"

          # Deploy release version
          mike deploy --push --update-aliases "$VERSION"

          echo "Release version $VERSION deployed successfully"

      - name: Build PR preview
        if: github.event_name == 'pull_request'
        run: |
          echo "Building documentation preview for PR..."
          mkdocs build --clean --strict --verbose
          echo "PR preview built successfully"

  update-versions:
    if: github.event_name == 'release'
    needs: deploy-docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mike>=2.0.0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions.json
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          RELEASE_NAME="${{ github.event.release.name }}"

          echo "Updating versions.json for release: $VERSION"
          echo "Release name: $RELEASE_NAME"

          # Get current versions from mike
          echo "Getting current deployed versions..."
          mike list --json > current_versions.json || echo "[]" > current_versions.json

          # Extract title from release name
          if [[ "$RELEASE_NAME" == *" - "* ]]; then
            TITLE="$RELEASE_NAME"
          else
            TITLE="v$VERSION - $RELEASE_NAME"
          fi

          # Create updated versions.json using Python
          python3 << 'PYTHON_EOF'
          import json
          import os

          version = os.environ.get('VERSION', '')
          title = os.environ.get('TITLE', '')

          versions_data = [
              {
                  "version": "latest",
                  "title": "Latest (Development)",
                  "aliases": ["main", "dev"]
              },
              {
                  "version": version,
                  "title": title,
                  "aliases": []
              }
          ]

          with open('versions.json', 'w') as f:
              json.dump(versions_data, f, indent=2)

          print(f"Created versions.json with version {version}")
          PYTHON_EOF

          echo "Updated versions.json:"
          cat versions.json

          # Commit and push if there are changes
          if ! git diff --quiet versions.json; then
            git add versions.json
            git commit -m "docs: Update versions.json for release v$VERSION"
            git push origin main
            echo "versions.json updated and pushed"
          else
            echo "No changes to versions.json"
          fi
        env:
          VERSION: ${{ github.event.release.tag_name }}
          TITLE: ${{ github.event.release.name }}
