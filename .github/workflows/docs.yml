name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '*.md'
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-minify-plugin
          pip install pymdown-extensions
          pip install mike

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy latest version (main branch)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          mike deploy --push --update-aliases latest main
          mike set-default --push latest

      - name: Deploy release version
        if: github.event_name == 'release'
        run: |
          VERSION=${{ github.event.release.tag_name }}
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "Deploying documentation for release version: $VERSION"
          mike deploy --push --update-aliases $VERSION
          
      - name: Build for PR preview
        if: github.event_name == 'pull_request'
        run: |
          mkdocs build --clean --strict

  update-versions-list:
    if: github.event_name == 'release'
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install mike

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update versions.json
        run: |
          VERSION=${{ github.event.release.tag_name }}
          VERSION=${VERSION#v}
          RELEASE_NAME="${{ github.event.release.name }}"
          RELEASE_BODY="${{ github.event.release.body }}"
          
          # Extract first line of release body as description
          DESCRIPTION=$(echo "$RELEASE_BODY" | head -n1 | sed 's/["\]/\\&/g')
          
          # If no description, use release name
          if [ -z "$DESCRIPTION" ]; then
            DESCRIPTION="$RELEASE_NAME"
          fi
          
          # Update versions.json
          cat > versions.json << EOF
          [
            {
              "version": "latest",
              "title": "Latest (Development)",
              "aliases": ["main", "dev"]
            },
            {
              "version": "$VERSION",
              "title": "$VERSION - $DESCRIPTION",
              "aliases": []
            }
          ]
          EOF
          
          # Commit and push updated versions.json
          git add versions.json
          git commit -m "docs: Update versions.json for release $VERSION" || exit 0
          git push origin main