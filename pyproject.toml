[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finopsoptimizer"
version = "1.0.0"
description = "A comprehensive multi-cloud cost optimization toolkit for AWS, Azure, and GCP"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "FinOpsOptimizer Team", email = "support@finopsoptimizer.com"}
]
maintainers = [
    {name = "FinOpsOptimizer Team", email = "support@finopsoptimizer.com"}
]
keywords = ["finops", "cloud", "cost", "optimization", "aws", "azure", "gcp", "cost-management"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "boto3>=1.26.0",
    "azure-mgmt-compute>=30.0.0",
    "azure-mgmt-resource>=23.0.0",
    "azure-mgmt-costmanagement>=4.0.0",
    "google-cloud-billing>=1.10.0",
    "google-cloud-compute>=1.10.0",
    "google-cloud-resourcemanager>=1.10.0",
    "pandas>=1.5.0",
    "numpy>=1.24.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "plotly>=5.13.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=1.10.0",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.3.0",
    "pre-commit>=3.0.0",
]
docs = [
    "mkdocs-material>=9.0.0",
    "mike>=1.1.0",
]

[project.scripts]
finops = "cli:cli"

[project.urls]
Homepage = "https://github.com/manikantesh/finopsoptimizer"
Documentation = "https://docs.finopsoptimizer.com"
Repository = "https://github.com/manikantesh/finopsoptimizer"
"Bug Tracker" = "https://github.com/manikantesh/finopsoptimizer/issues"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"] 