site_name: FinOps Optimizer Documentation
site_description: Enterprise-grade cost optimization for multi-cloud environments
site_author: FinOps Optimizer Team
site_url: https://manikantesh.github.io/finopsoptimizerdocs/

repo_name: manikantesh/finopsoptimizerdocs
repo_url: https://github.com/manikantesh/finopsoptimizerdocs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-wifi
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-wifi-off
        name: Switch to light mode
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.delay
    - navigation.instant.loading
    - navigation.instant.preload
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/manikantesh/finopsoptimizerdocs
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/finopsoptimizerdocs
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/finopsoptimizerdocs

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
      linenums: false
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slug_theme: material
      tabs_style: material
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Configuration: configuration.md
    - Tutorial: tutorial.md
  - User Guide:
    - CLI Reference: cli-reference.md
    - API Reference: api-reference.md
    - Web Dashboard: web-dashboard.md
  - Advanced Topics:
    - Security: security.md
    - Performance: performance.md
    - Monitoring: monitoring.md
  - Development:
    - Contributing: contributing.md
    - Troubleshooting: troubleshooting.md
  - About:
    - License: ../LICENSE
    - Changelog: ../CHANGELOG.md

docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2024 FinOps Optimizer Team 