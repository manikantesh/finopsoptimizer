<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinOps Optimizer Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .sidebar {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .chart-container {
            position: relative;
            height: 300px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">FinOps Optimizer</h4>
                        <p class="text-white-50">Cost Optimization Dashboard</p>
                    </div>
                    
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#dashboard">
                                <i class="fas fa-tachometer-alt me-2"></i>
                                Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#costs">
                                <i class="fas fa-dollar-sign me-2"></i>
                                Cost Analysis
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#recommendations">
                                <i class="fas fa-lightbulb me-2"></i>
                                Recommendations
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#forecast">
                                <i class="fas fa-chart-line me-2"></i>
                                Cost Forecast
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#reports">
                                <i class="fas fa-file-alt me-2"></i>
                                Reports
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#settings">
                                <i class="fas fa-cog me-2"></i>
                                Settings
                            </a>
                        </li>
                        <li class="nav-item mt-4">
                            <a class="nav-link text-white" href="/logout">
                                <i class="fas fa-sign-out-alt me-2"></i>
                                Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </nav>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Dashboard</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-secondary" onclick="refreshData()">
                                <i class="fas fa-sync-alt"></i> Refresh
                            </button>
                            <button type="button" class="btn btn-sm btn-primary" onclick="runOptimization()">
                                <i class="fas fa-magic"></i> Run Optimization
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Metrics Cards -->
                <div class="row mb-4">
                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card metric-card">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-white-50 text-uppercase mb-1">
                                            Total Cost
                                        </div>
                                        <div class="h5 mb-0 font-weight-bold text-white" id="totalCost">$0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-dollar-sign fa-2x text-white-50"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card metric-card">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-white-50 text-uppercase mb-1">
                                            Potential Savings
                                        </div>
                                        <div class="h5 mb-0 font-weight-bold text-white" id="potentialSavings">$0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-piggy-bank fa-2x text-white-50"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card metric-card">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-white-50 text-uppercase mb-1">
                                            Recommendations
                                        </div>
                                        <div class="h5 mb-0 font-weight-bold text-white" id="recommendationsCount">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-lightbulb fa-2x text-white-50"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-3 col-md-6 mb-4">
                        <div class="card metric-card">
                            <div class="card-body">
                                <div class="row no-gutters align-items-center">
                                    <div class="col mr-2">
                                        <div class="text-xs font-weight-bold text-white-50 text-uppercase mb-1">
                                            Providers
                                        </div>
                                        <div class="h5 mb-0 font-weight-bold text-white" id="providersCount">0</div>
                                    </div>
                                    <div class="col-auto">
                                        <i class="fas fa-cloud fa-2x text-white-50"></i>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="row mb-4">
                    <div class="col-xl-8 col-lg-7">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="m-0 font-weight-bold">Cost Trend</h6>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <canvas id="costTrendChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-xl-4 col-lg-5">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="m-0 font-weight-bold">Service Breakdown</h6>
                            </div>
                            <div class="card-body">
                                <div class="chart-container">
                                    <canvas id="serviceBreakdownChart"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Provider Status and Recommendations -->
                <div class="row">
                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="m-0 font-weight-bold">Provider Status</h6>
                            </div>
                            <div class="card-body">
                                <div id="providerStatus">
                                    <!-- Provider status will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="card">
                            <div class="card-header">
                                <h6 class="m-0 font-weight-bold">Top Recommendations</h6>
                            </div>
                            <div class="card-body">
                                <div id="topRecommendations">
                                    <!-- Recommendations will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Global variables
        let costTrendChart = null;
        let serviceBreakdownChart = null;

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadDashboardData();
            loadProviderStatus();
            loadRecommendations();
        });

        function loadDashboardData() {
            fetch('/api/costs?days=30')
                .then(response => response.json())
                .then(data => {
                    updateMetrics(data);
                    updateCharts(data);
                })
                .catch(error => {
                    console.error('Error loading cost data:', error);
                });
        }

        function updateMetrics(data) {
            const totalCost = data.summary?.total_cost || 0;
            document.getElementById('totalCost').textContent = `$${totalCost.toFixed(2)}`;
            
            const providersCount = data.summary?.providers_analyzed?.length || 0;
            document.getElementById('providersCount').textContent = providersCount;
        }

        function updateCharts(data) {
            updateCostTrendChart(data);
            updateServiceBreakdownChart(data);
        }

        function updateCostTrendChart(data) {
            const ctx = document.getElementById('costTrendChart').getContext('2d');
            
            if (costTrendChart) {
                costTrendChart.destroy();
            }

            const dailyCosts = data.aws?.daily_costs || [];
            const labels = dailyCosts.map(item => item.date);
            const costs = dailyCosts.map(item => item.cost);

            costTrendChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Daily Cost',
                        data: costs,
                        borderColor: 'rgb(75, 192, 192)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true
                        }
                    }
                }
            });
        }

        function updateServiceBreakdownChart(data) {
            const ctx = document.getElementById('serviceBreakdownChart').getContext('2d');
            
            if (serviceBreakdownChart) {
                serviceBreakdownChart.destroy();
            }

            const serviceBreakdown = data.aws?.service_breakdown || {};
            const labels = Object.keys(serviceBreakdown);
            const costs = Object.values(serviceBreakdown);

            serviceBreakdownChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: costs,
                        backgroundColor: [
                            '#FF6384',
                            '#36A2EB',
                            '#FFCE56',
                            '#4BC0C0',
                            '#9966FF'
                        ]
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false
                }
            });
        }

        function loadProviderStatus() {
            fetch('/api/status')
                .then(response => response.json())
                .then(data => {
                    const statusHtml = Object.entries(data).map(([provider, status]) => `
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span>
                                <span class="status-indicator ${status ? 'status-online' : 'status-offline'}"></span>
                                ${provider.toUpperCase()}
                            </span>
                            <span class="badge ${status ? 'bg-success' : 'bg-danger'}">
                                ${status ? 'Online' : 'Offline'}
                            </span>
                        </div>
                    `).join('');
                    
                    document.getElementById('providerStatus').innerHTML = statusHtml;
                })
                .catch(error => {
                    console.error('Error loading provider status:', error);
                });
        }

        function loadRecommendations() {
            fetch('/api/recommendations')
                .then(response => response.json())
                .then(data => {
                    const recommendationsHtml = data.slice(0, 5).map(rec => `
                        <div class="border-bottom pb-2 mb-2">
                            <div class="d-flex justify-content-between">
                                <strong>${rec.description}</strong>
                                <span class="badge bg-warning">$${rec.potential_savings?.toFixed(2) || 0}</span>
                            </div>
                            <small class="text-muted">${rec.provider} - ${rec.priority}</small>
                        </div>
                    `).join('');
                    
                    document.getElementById('topRecommendations').innerHTML = recommendationsHtml;
                    document.getElementById('recommendationsCount').textContent = data.length;
                })
                .catch(error => {
                    console.error('Error loading recommendations:', error);
                });
        }

        function refreshData() {
            loadDashboardData();
            loadProviderStatus();
            loadRecommendations();
        }

        function runOptimization() {
            fetch('/api/optimize', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => response.json())
            .then(data => {
                alert('Optimization completed! Check recommendations for details.');
                refreshData();
            })
            .catch(error => {
                console.error('Error running optimization:', error);
                alert('Error running optimization');
            });
        }
    </script>
</body>
</html>
