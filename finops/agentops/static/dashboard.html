<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AgentOps</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --border: #e5e7eb;
    --text: #0f172a;
    --muted: #6b7280;
    --accent: #2563eb;
    --ok: #16a34a;
    --warn: #b45309;
    --crit: #dc2626;
    --row-hover: #f9fafb;
    --chip-bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex: 0 0 auto;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .conn {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.stale { background: var(--crit); }

  .stats {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    border-bottom: 1px solid var(--border);
  }
  .stat {
    padding: 14px 24px;
    border-right: 1px solid var(--border);
  }
  .stat:last-child { border-right: none; }
  .stat .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 22px; font-weight: 600; margin-top: 3px; font-variant-numeric: tabular-nums; }

  main {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: 1fr 1.6fr;
    min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-auto-rows: minmax(0, 1fr); overflow-y: auto; }
  }
  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--border);
  }
  .panel:last-child { border-right: none; }
  .panel-head {
    flex: 0 0 auto;
    padding: 10px 24px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }
  .panel-body {
    flex: 1 1 auto;
    overflow-y: auto;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td {
    text-align: left;
    padding: 9px 24px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    color: var(--muted);
    font-weight: 500;
    position: sticky;
    top: 0;
    background: var(--panel);
  }
  tr:hover td { background: var(--row-hover); }
  td.message, td.wrap { white-space: normal; }

  .chip { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 600; background: var(--chip-bg); }
  .chip.ok, .chip.open { color: var(--ok); background: #f0fdf4; }
  .chip.closed { color: var(--muted); }
  .chip.error, .chip.critical { color: var(--crit); background: #fef2f2; }
  .chip.warning { color: var(--warn); background: #fffbeb; }

  .empty { color: var(--muted); font-size: 13px; padding: 24px; }
  code { background: var(--chip-bg); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>AgentOps</h1>
  <span class="conn" id="conn"><span class="dot"></span>connecting&hellip;</span>
</header>

<div class="stats" id="stats"></div>

<main>
  <div class="panel">
    <div class="panel-head">Alerts</div>
    <div class="panel-body">
      <table id="alerts-table">
        <thead><tr><th>Severity</th><th>Rule</th><th>Message</th><th>Root cause</th><th>When</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="alerts-empty" style="display:none;">No alerts.</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">Sessions</div>
    <div class="panel-body">
      <table id="sessions-table">
        <thead><tr><th>Session</th><th>Agent</th><th>Channel</th><th>Status</th><th>Calls</th><th>Errors</th><th>Cost</th><th>Started</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="sessions-empty" style="display:none;">No sessions yet &mdash; point an OTLP exporter at <code>/v1/traces</code> and they'll show up here live.</div>
    </div>
  </div>
</main>

<script>
function fmtUsd(v) { return "$" + (v || 0).toFixed(4); }
function fmtTime(ts) { return ts ? new Date(ts * 1000).toLocaleTimeString() : "–"; }
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

function renderStats(stats) {
  const items = [
    ["Sessions", stats.sessions],
    ["LLM calls", stats.llm_calls],
    ["Errors", stats.errors],
    ["Cost (1h)", fmtUsd(stats.cost)],
    ["P95 latency", (stats.latency_p95_ms || 0).toFixed(0) + "ms"],
  ];
  document.getElementById("stats").innerHTML = items.map(([label, value]) =>
    `<div class="stat"><div class="label">${label}</div><div class="value">${value}</div></div>`
  ).join("");
}

function renderAlerts(alerts) {
  const body = document.querySelector("#alerts-table tbody");
  document.getElementById("alerts-empty").style.display = alerts.length ? "none" : "block";
  document.getElementById("alerts-table").style.display = alerts.length ? "table" : "none";
  body.innerHTML = alerts.map(a => `
    <tr>
      <td><span class="chip ${esc(a.severity)}">${esc(a.severity)}</span></td>
      <td><code>${esc(a.rule)}</code></td>
      <td class="message">${esc(a.message)}</td>
      <td class="wrap">${esc(a.root_cause || "–")}</td>
      <td>${fmtTime(a.created_at)}</td>
    </tr>`).join("");
}

function renderSessions(sessions) {
  const body = document.querySelector("#sessions-table tbody");
  document.getElementById("sessions-empty").style.display = sessions.length ? "none" : "block";
  document.getElementById("sessions-table").style.display = sessions.length ? "table" : "none";
  body.innerHTML = sessions.map(s => `
    <tr>
      <td><code>${esc(s.session_id)}</code></td>
      <td>${esc(s.agent_id)}</td>
      <td>${esc(s.channel)}</td>
      <td><span class="chip ${s.status === 'error' ? 'error' : (s.status === 'open' ? 'open' : 'closed')}">${esc(s.status)}</span></td>
      <td>${s.call_count}</td>
      <td>${s.error_count}</td>
      <td>${fmtUsd(s.total_cost)}</td>
      <td>${fmtTime(s.started_at)}</td>
    </tr>`).join("");
}

function connect() {
  const connEl = document.getElementById("conn");
  const source = new EventSource("/api/live");
  source.onopen = () => { connEl.innerHTML = '<span class="dot"></span>live'; };
  source.onerror = () => { connEl.innerHTML = '<span class="dot stale"></span>reconnecting&hellip;'; };
  source.onmessage = (evt) => {
    const data = JSON.parse(evt.data);
    renderStats(data.stats || {});
    renderAlerts(data.alerts || []);
    renderSessions(data.sessions || []);
  };
}
connect();
</script>
</body>
</html>
