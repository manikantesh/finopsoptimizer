site_name: FinOps Optimizer
site_description: Multi-Cloud Cost Optimization Platform for AWS, Azure, GCP, and Oracle Cloud
site_author: FinOps Optimizer Team
site_url: https://manikantesh.github.io/finopsoptimizer/

repo_name: manikantesh/finopsoptimizer
repo_url: https://github.com/manikantesh/finopsoptimizer
edit_uri: edit/main/docs/

theme:
  name: material
  logo: favicon/logo.png
  favicon: favicon/favicon-32x32.png
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - announce.dismiss
    # - content.action.edit  # Removed to hide edit icon
    # - content.action.view  # Removed to hide view icon
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tabs.link
    - content.tooltips
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.delay
    - navigation.instant.loading
    - navigation.instant.preload
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow

extra:
  version:
    provider: mike
    default: latest
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/manikantesh/finopsoptimizer
    - icon: fontawesome/brands/twitter
      link: https://twitter.com/finopsoptimizer
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/company/finopsoptimizer

extra_css:
  - styles.css

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
      linenums: false
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.tabbed

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      enable_git_follow: false
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Local Setup: local-setup.md
    - Configuration: configuration.md
    - Tutorial: tutorial.md

  - User Guide:
    - CLI Reference: cli-reference.md
    - API Reference: api-reference.md
    - Web Dashboard: web-dashboard.md
  - Advanced Topics:
    - Security: security.md
    - Performance: performance.md
    - Monitoring: monitoring.md
  - Development:
    - Contributing: contributing.md
    - Deployment: deployment.md
    - Release Management: release-management.md
    - Versioning Guide: versioning-guide.md
    - Troubleshooting: troubleshooting.md
  - Resources:
    - Future Roadmap: future-roadmap.md
    - Implementation Summary: implementation-summary.md

docs_dir: docs
site_dir: site

copyright: Copyright &copy; 2024 FinOps Optimizer Team - Multi-Cloud Cost Optimization 